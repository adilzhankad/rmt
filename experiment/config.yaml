# Stage 2 re-run: one fixed list of 8 models on four OCR benchmarks.
# Seed, sample size and bootstrap size are read from code/harness.py; the values
# below must match it (sample_items.py and run.py assert this).

seed: 2026
items:
  main: 400
  pilot: 20
bootstrap: 1000

# Same generation settings for every model.
max_tokens: 4096
temperature: 0
# Every model gets the benchmark's own prompt (dataset.build_prompt), as the API models do.
# VLMEvalKit lets some open models (InternVL, MiniCPM) replace it with their own per-benchmark
# prompt; e.g. InternVL appends "Answer the question using a single word or phrase." to
# OCRBench v2 full-page OCR tasks and reads the empty `question` field on OmniDocBench.
prompt: benchmark

vlmevalkit:
  repo: https://github.com/open-compass/VLMEvalKit
  commit: f57c3d90154010ba176fbafc39bb79ee521fbf70

benchmarks:
  OCRBench_v2:
    label: OCRBench v2
    dataset: OCRBench_v2
    md5: 65d04fe07b4d4ee33e73fc8e7d4d46b0
    pred_format: tsv
    primary_metric: English Overall Score
    direction: higher
    secondary_metrics: [Chinese Overall Score]
  CCOCR:
    label: CC-OCR
    dataset: CCOCR
    md5: f8927b76510ffe04e59d45e3f8e8b620
    pred_format: tsv
    primary_metric: total
    direction: higher
    secondary_metrics: [multi_scene_ocr, multi_lan_ocr, kie, doc_parsing]
  OmniDocBench:
    label: OmniDocBench
    dataset: OmniDocBench
    md5: 0fa5ccf31e682e219cb9ca83da741a59
    pred_format: tsv
    primary_metric: overall_EN      # mean normalised edit distance, English pages
    direction: lower
    secondary_metrics: [overall_CH]
  olmOCRBench:
    label: olmOCR-Bench
    dataset: olmOCRBench
    md5: 25fe250887fee675f887a2a2d24df185
    pred_format: xlsx               # the evaluator reads predictions with pd.read_excel
    primary_metric: overall
    direction: higher
    secondary_metrics: []

# VLMEvalKit keys. `overrides` are passed to the VLMEvalKit constructor on top of
# its own config; they only change what is needed to run the model with the
# official API and the common max_tokens / temperature.
models:
  GPT4o_20240806:
    kind: api
    provider: openai
    overrides: {max_tokens: MAX_TOKENS}
  GPT4o_MINI:
    kind: api
    provider: openai
    overrides: {max_tokens: MAX_TOKENS}
  # The plan had three more closed models (GeminiPro2-5, GeminiFlash2-0, Claude4_Sonnet).
  # claude-sonnet-4-20250514 and gemini-2.0-flash were shut down in June 2026 and
  # gemini-2.5-pro is being retired. Their current successors were piloted (Gemini 3.5 Flash /
  # Flash-Lite, logged in logs/run_log.csv) but need paid API tiers that the project cannot fund
  # (Gemini free tier: 20 requests/day; Anthropic has no free tier). They are replaced by three
  # open-weight models from three other developers, all run with the same settings on our GPU.
  Qwen2.5-VL-7B-Instruct:
    kind: local
    # VLMEvalKit's own vLLM backend for this wrapper (same messages, same image resizing, greedy
    # decoding as in its transformers path, which uses top_k=1). The transformers path was ~1.4x
    # slower than InternVL3 and did not fit the GPU budget. All four benchmarks run on vLLM; the
    # first OCRBench v2 run on transformers is kept in logs/run_log.csv and raw/superseded/.
    env: vllm
    # gpu_utils: vLLM reserves half of the 48 GB card, so one transformers job runs next to it
    overrides: {max_new_tokens: MAX_TOKENS, use_vllm: true, gpu_utils: 0.5}
  InternVL3-8B:
    kind: local
    env: open
    overrides: {max_new_tokens: MAX_TOKENS}
  Ovis2-8B:
    kind: local
    env: legacy
    overrides: {max_new_tokens: MAX_TOKENS}
  # Idefics3-8B-Llama3 and Phi-3.5-Vision were piloted (logs/run_log.csv) but needed about 5 min
  # per OmniDocBench page, which the GPU budget cannot cover for 1,600 items. They are replaced by
  # two models from other developers that are also on the published OCRBench v2 leaderboard.
  # MiniCPM-V-4_5 (piloted, logs/run_log.csv) and deepseek_vl2_small were dropped before the main
  # run to fit the GPU budget (USD 20): MiniCPM was the slowest model in the pilot (about 21 GPU-h
  # for the main run) and the 16B DeepSeek-VL2-small cannot share the 48 GB GPU with another model.
  llava-onevision-qwen2-7b-ov-hf:
    kind: local
    env: open
    # The VLMEvalKit wrapper calls generate(max_new_tokens=2048) with no way to pass kwargs;
    # these values are forced on that call so the model gets the same settings as the others.
    generate_overrides: {max_new_tokens: MAX_TOKENS, do_sample: false}
